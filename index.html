<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido Especial ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffe6e9 0%, #ffb6c1 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    .container {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 90%;
      position: relative;
    }

    h1 {
      color: #d63384;
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    p {
      color: #555;
      font-size: 1.1rem;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 60px;
      position: relative;
    }

    button {
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    #btn-sim {
      background-color: #28a745;
      color: white;
      box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3);
    }

    #btn-sim:hover {
      background-color: #218838;
      transform: scale(1.05);
    }

    #btn-nao {
      background-color: #dc3545;
      color: white;
      box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3);
      position: relative;
      z-index: 10;
    }

    /* Estilo da mensagem de sucesso */
    .mensagem-sucesso {
      display: none;
    }

    .mensagem-sucesso h2 {
      color: #28a745;
      font-size: 2rem;
      margin-bottom: 15px;
    }

    .mensagem-sucesso p {
      font-size: 1.2rem;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="container" id="card">
    <div id="conteudo-inicial">
      <h1 id="titulo"></h1>
      <p id="texto-pedido"></p>
      <div class="btn-container">
        <button id="btn-sim">SIM!</button>
        <button id="btn-nao">NÃO</button>
      </div>
    </div>

    <div id="conteudo-sucesso" class="mensagem-sucesso">
      <h2>🎉 Sabia! 🎉</h2>
      <p id="texto-sucesso"></p>
    </div>
  </div>

  <script>
    // ===============================================
    // EDITE SEUS DADOS AQUI
    // ===============================================
    const MEU_NOME = "Alexandre";
    const NOME_DELA = "Victória";
    
    // Mensagem que aparece após ela clicar em "SIM"
    const MENSAGEM_FINAL = `Eu sabia que você me queria, ${NOME_DELA}! ❤️ Agora é oficial!`;
    // ===============================================

    // Preenchendo os textos da tela dinamicamente
    document.getElementById('titulo').innerText = `Oi, ${NOME_DELA}! ❤️`;
    document.getElementById('texto-pedido').innerText = `${MEU_NOME} tem uma pergunta importante para você: Quer ser minha mulher?`;
    document.getElementById('texto-sucesso').innerText = MENSAGEM_FINAL;

    const btnNao = document.getElementById('btn-nao');
    const btnSim = document.getElementById('btn-sim');
    const conteudoInicial = document.getElementById('conteudo-inicial');
    const conteudoSucesso = document.getElementById('conteudo-sucesso');

    // Função para mover o botão de NÃO para um lugar aleatório
    function moverBotaoNao() {
  const btnRect = btnNao.getBoundingClientRect();

  // Pega a largura e altura total da tela do celular/computador
  const maxX = window.innerWidth - btnRect.width;
  const maxY = window.innerHeight - btnRect.height;

  const randomX = Math.floor(Math.random() * maxX);
  const randomY = Math.floor(Math.random() * maxY);

  // Muda o posicionamento para 'fixed' para conseguir ir a qualquer canto da tela
  btnNao.style.position = 'fixed';
  btnNao.style.left = `${randomX}px`;
  btnNao.style.top = `${randomY}px`;
}

    // Eventos para fugir no computador (mouseover) e no celular (touchstart / click)
    btnNao.addEventListener('mouseover', moverBotaoNao);
    btnNao.addEventListener('touchstart', function (e) {
      e.preventDefault(); // Impede o toque de acionar o clique
      moverBotaoNao();
    });
    btnNao.addEventListener('click', moverBotaoNao);

    // Evento de clique no botão SIM
    btnSim.addEventListener('click', function () {
      conteudoInicial.style.display = 'none';
      conteudoSucesso.style.display = 'block';
    });
  </script>
</body>
</html>
